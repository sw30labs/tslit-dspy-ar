[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tslit-dspy"
version = "0.1.0"
description = "DSPy-compiled threat detection pipeline for TSLIT"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Nic Cravino" },
]

dependencies = [
    "dspy>=2.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
agent = [
    "openai>=1.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
tslit-serve = "tslit_dspy.web.server:main"

[tool.hatch.build.targets.wheel]
packages = ["tslit_dspy", "tslit_hw"]

[tool.hatch.build.targets.wheel.artifacts]
include = ["tslit_dspy/web/static/index.html", "tslit_dspy/web/static/favicon.svg"]