[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tslit-dspy"
version = "0.2.0"
description = "DSPy-compiled integrity testing pipeline for open-weight LLMs (TSLIT v0.2)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Nicolas Cravino" },
]
keywords = [
    "dspy",
    "llm-security",
    "backdoor-detection",
    "model-integrity",
    "tslit",
]

dependencies = [
    "dspy>=2.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
agent = [
    "openai>=1.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["tslit_dspy"]
